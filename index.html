<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thirty3rdStudio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d0d0d;
      color: #e8e8e8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 640px;
      width: 100%;
      text-align: center;
    }

    .wordmark {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 3rem;
    }

    h1 {
      font-size: clamp(1.6rem, 5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.2;
      margin-bottom: 3rem;
      color: #fff;
    }

    .apps {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
    }

    .app-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 1.25rem 1.5rem;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .app-info { flex: 1; }

    .app-name {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
      color: #e8e8e8;
    }

    .app-desc {
      font-size: 0.8rem;
      color: #555;
    }

    .app-links a {
      font-size: 0.8rem;
      color: #555;
      text-decoration: none;
      white-space: nowrap;
      transition: color 0.2s;
    }

    .app-links a:hover { color: #aaa; }
  </style>
</head>
<body>
  <div class="container">
    <div class="wordmark">Thirty3rdStudio</div>

    <h1>Simple, focused apps<br>made with care.</h1>

    <div class="apps">
      <div class="app-card">
        <div class="app-name">Daily Growth Challenge</div>
        <div class="app-desc">Available on the App Store</div>
        <div class="app-links">
          <a href="dagroch/privacy-policy.html">Privacy Policy</a>
        </div>
      </div>

      <div class="app-card">
        <div class="app-info">
          <div class="app-name">GrowIt</div>
          <div class="app-desc">Garden tracker with AI</div>
        </div>
        <div class="app-links">
          <a href="growit/privacy-policy.html">Privacy Policy</a>
        </div>
      </div>

      <div class="app-card">
        <div class="app-info">
          <div class="app-name">The Salty Carrot</div>
          <div class="app-desc">Recipes and meal planning with AI</div>
        </div>
        <div class="app-links">
          <a href="saltycarrot/privacy-policy.html">Privacy Policy</a>
        </div>
      </div>

      <div class="app-card">
        <div class="app-info">
          <div class="app-name">SJ Whales</div>
          <div class="app-desc">Live whale-watching map for San Juan Island</div>
        </div>
        <div class="app-links">
          <a href="whale/privacy-policy.html">Privacy Policy</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
